[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "armd"
version = "2.0.0"
description = "Joint antibiotic susceptibility prediction and causal collateral-resistance estimation on the ARMD dataset"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
armd-run = "armd.run_analysis:main"

[tool.setuptools]
packages = ["armd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:pandas.*"]
